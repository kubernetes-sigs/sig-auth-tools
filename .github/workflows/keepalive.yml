# Preemptively re-enable scheduled workflows monthly to avoid inactivity disabling.
# Keep this workflow on main; GITHUB_TOKEN needs actions: write, not branch access.
# If disabled, re-enable both workflows and run this one manually.
name: sig-auth-workflow-keepalive

on:
  schedule:
    - cron: "17 3 1 * *"  # Monthly, on the first day at 03:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Keep scheduled workflows active
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Keep scheduled workflows enabled
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in keepalive.yml sync-sig-auth-project.yml; do
            gh api --method PUT \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done
